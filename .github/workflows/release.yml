name: Build Release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload assets to, for example v3.3.14"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-release:
    name: Build and upload release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(grep '^VERSION_NAME=' version.properties | cut -d'=' -f2)
          VERSION_CODE=$(grep '^VERSION_CODE=' version.properties | cut -d'=' -f2)
          test -n "$VERSION_NAME" || { echo "::error::VERSION_NAME is missing."; exit 1; }
          test -n "$VERSION_CODE" || { echo "::error::VERSION_CODE is missing."; exit 1; }
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Validate update manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          version_props = {}
          for line in Path("version.properties").read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if line and not line.startswith("#") and "=" in line:
                  key, value = line.split("=", 1)
                  version_props[key.strip()] = value.strip()

          manifest = json.loads(Path("update.json").read_text(encoding="utf-8"))
          app = manifest["app"]
          expected_name = version_props["VERSION_NAME"]
          expected_code = int(version_props["VERSION_CODE"])
          expected_url = (
              "https://github.com/Acceleratorer/WUWA-VN-Android/releases/download/"
              f"v{expected_name}/WUWA-VN-v{expected_name}-release.apk"
          )

          checks = [
              (app["version_name"] == expected_name, f"update.json version_name must be {expected_name}"),
              (int(app["version_code"]) == expected_code, f"update.json version_code must be {expected_code}"),
              (app["supported_game_version"] == "3.3", "supported_game_version must remain 3.3"),
              (app["minimum_game_version"] == "3.3", "minimum_game_version must remain 3.3"),
              (app["apk_url"] == expected_url, f"apk_url must be {expected_url}"),
          ]
          failures = [message for ok, message in checks if not ok]
          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Validate release tag
        shell: bash
        run: |
          EXPECTED_TAG="v${{ steps.version.outputs.name }}"
          ACTUAL_TAG=""
          if [ "${{ github.event_name }}" = "release" ]; then
            ACTUAL_TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            ACTUAL_TAG="${{ github.event.inputs.release_tag }}"
          fi
          if [ -z "$ACTUAL_TAG" ]; then
            echo "No release tag supplied; workflow will build artifacts without uploading release assets."
            exit 0
          fi
          if [ "$EXPECTED_TAG" != "$ACTUAL_TAG" ]; then
            echo "::error::Tag mismatch. Expected $EXPECTED_TAG but got $ACTUAL_TAG"
            exit 1
          fi

      - name: Decode release keystore
        shell: bash
        env:
          WUWA_RELEASE_KEYSTORE_BASE64: ${{ secrets.WUWA_RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$WUWA_RELEASE_KEYSTORE_BASE64" || { echo "::error::WUWA_RELEASE_KEYSTORE_BASE64 secret is missing."; exit 1; }
          printf '%s' "$WUWA_RELEASE_KEYSTORE_BASE64" | base64 -d > release-keystore.jks

      - name: Build release APK
        shell: bash
        env:
          WUWA_RELEASE_STORE_FILE: ${{ github.workspace }}/release-keystore.jks
          WUWA_RELEASE_STORE_PASSWORD: ${{ secrets.WUWA_RELEASE_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          WUWA_RELEASE_KEY_ALIAS: ${{ secrets.WUWA_RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
          WUWA_RELEASE_KEY_PASSWORD: ${{ secrets.WUWA_RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          test -n "$WUWA_RELEASE_STORE_PASSWORD" || { echo "::error::WUWA_RELEASE_STORE_PASSWORD secret is missing."; exit 1; }
          test -n "$WUWA_RELEASE_KEY_ALIAS" || { echo "::error::WUWA_RELEASE_KEY_ALIAS secret is missing."; exit 1; }
          test -n "$WUWA_RELEASE_KEY_PASSWORD" || { echo "::error::WUWA_RELEASE_KEY_PASSWORD secret is missing."; exit 1; }
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease

      - name: Prepare artifact names
        id: artifact
        shell: bash
        run: |
          VERSION_NAME="${{ steps.version.outputs.name }}"
          SRC_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$SRC_APK" || { echo "::error::Release APK was not produced."; exit 1; }
          OUT_APK="WUWA-VN-v${VERSION_NAME}-release.apk"
          cp "$SRC_APK" "$OUT_APK"
          sha256sum "$OUT_APK" | tee sha256.txt
          echo "apk=$OUT_APK" >> "$GITHUB_OUTPUT"

      - name: Verify release APK
        shell: bash
        run: |
          python tools/verify-release-apk.py "${{ steps.artifact.outputs.apk }}"

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WUWA-VN-release
          if-no-files-found: warn
          path: |
            ${{ steps.artifact.outputs.apk }}
            sha256.txt
            release-verification-report.txt

      - name: Upload assets to GitHub Release
        if: github.event_name == 'release' || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.release_tag }}
          files: |
            ${{ steps.artifact.outputs.apk }}
            sha256.txt
            release-verification-report.txt
