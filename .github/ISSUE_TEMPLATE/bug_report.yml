name: Báo lỗi
description: Gửi lỗi khi cài patch, backup, restore, Shizuku hoặc cập nhật app.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn bạn đã báo lỗi. Vui lòng gửi kèm log trong app nếu có để dễ kiểm tra.
  - type: input
    id: app_version
    attributes:
      label: Phiên bản app
      placeholder: "1.3.7"
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: Phiên bản Android
      placeholder: "Android 14"
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: Bạn đang làm thao tác nào?
      options:
        - Install Vietnamese Patch
        - Update Vietnamese Patch
        - Restore Original Files
        - Check Game Folder
        - Open Shizuku
        - Update App
    validations:
      required: true
  - type: textarea
    id: debug_log
    attributes:
      label: Debug log
      description: Dán log từ nút Copy Debug Log hoặc Export Log trong app.
      render: text
      placeholder: |
        [22:31:10] App version: 1.3.7
        [22:31:10] Android version: 14
        [22:31:11] Shizuku: running
        [22:31:11] Permission: granted
        [22:31:12] Game folder: found
        [22:31:15] Backup: success
        [22:31:17] SHA-256: verified
        [22:31:20] Apply patch: failed
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Mô tả thêm
      description: Ghi rõ máy đang dùng, bản game, bước lỗi xảy ra và ảnh chụp màn hình nếu có.
    validations:
      required: false
